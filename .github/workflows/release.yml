name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    name: Attach the card to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the card version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARD=$(grep -oP 'const PVT_VERSION = "\K[^"]+' dist/pvt-vigilance-card.js)
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG card=$CARD package=$PKG"
          if [ "$TAG" != "$CARD" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $TAG does not match PVT_VERSION ($CARD) and package.json ($PKG)"
            exit 1
          fi

      - name: Upload pvt-vigilance-card.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/pvt-vigilance-card.js --clobber
