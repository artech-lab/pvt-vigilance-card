name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate the repository for HACS
        uses: hacs/action@main
        with:
          category: plugin

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Source is plain ASCII
        run: "! grep -nP '[^\\x00-\\x7F]' dist/pvt-vigilance-card.js"
      - name: Unit tests
        run: npm test
        env:
          TZ: UTC
